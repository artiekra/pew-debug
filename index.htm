<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PewPew Live Dev Sandbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* main game layout splits */
        #gameWrapper { width: 70%; height: 100vh; position: relative; }
        #devPanel { width: 30%; height: 100vh; overflow-y: auto; background-color: #1e1e1e; color: #d4d4d4; font-family: monospace; font-size: 13px; padding: 15px; border-left: 2px solid #333; }
        #gameIframe { width: 100%; height: 100%; border: none; }
        
        /* pretty tree css */
        .tree-node { margin-left: 15px; }
        .tree-key { color: #9cdcfe; font-weight: bold; }
        .tree-val-string { color: #ce9178; }
        .tree-val-number { color: #b5cea8; }
        .tree-val-boolean { color: #569cd6; }
    </style>
</head>
<body id="mainBody" class="bg-light">

    <div id="uploadContainer" class="container mt-5">
        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <h4 class="card-title text-center mb-4">Upload Level Folder</h4>
                
                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="folderInput" class="form-label text-muted">Select your Lua level directory</label>
                        <input class="form-control" type="file" id="folderInput" webkitdirectory directory multiple required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="uploadBtn">Upload & Launch</button>
                </form>

                <div id="errorArea" class="mt-4 d-none">
                    <div class="alert alert-danger text-center" role="alert" id="errorMessage"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="gameContainer" class="d-none d-flex w-100 h-100">
        
        <div id="gameWrapper">
            <button onclick="location.reload()" class="btn btn-sm btn-outline-light position-absolute top-0 start-0 m-2" style="z-index: 100;">
                &larr; Back
            </button>
            <iframe id="gameIframe" src=""></iframe>
        </div>

        <div id="devPanel">
            <h5 class="text-light mb-3 border-bottom border-secondary pb-2">Live Memory Tree</h5>
            <div id="memoryTree">Waiting for game update tick...</div>
        </div>
    </div>

    <script>
        // cute little recursive function to turn json into html nodes
        function renderJsonTree(obj) {
            let html = '<div class="tree-node">';
            for (const key in obj) {
                const val = obj[key];
                html += `<div><span class="tree-key">${key}:</span> `;
                
                if (val !== null && typeof val === "object") {
                    html += renderJsonTree(val);
                } else if (typeof val === "string") {
                    html += `<span class="tree-val-string">"${val}"</span>`;
                } else if (typeof val === "number") {
                    html += `<span class="tree-val-number">${val}</span>`;
                } else if (typeof val === "boolean") {
                    html += `<span class="tree-val-boolean">${val}</span>`;
                } else {
                    html += `<span>${val}</span>`;
                }
                html += '</div>';
            }
            html += '</div>';
            return html;
        }

        document.getElementById("uploadForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            const fileInput = document.getElementById("folderInput");
            const uploadContainer = document.getElementById("uploadContainer");
            const gameContainer = document.getElementById("gameContainer");
            const gameIframe = document.getElementById("gameIframe");
            const errorArea = document.getElementById("errorArea");
            const errorMessage = document.getElementById("errorMessage");
            const uploadBtn = document.getElementById("uploadBtn");
            const mainBody = document.getElementById("mainBody");

            errorArea.classList.add("d-none");
            uploadBtn.textContent = "Instrumenting code...";
            uploadBtn.disabled = true;

            const formData = new FormData();
            for (let i = 0; i < fileInput.files.length; i++) {
                const file = fileInput.files[i];
                formData.append("files", file, file.webkitRelativePath);
            }

            try {
                const response = await fetch("/inject/", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) throw new Error("server responded with an error.");

                const data = await response.json();
                
                uploadContainer.classList.add("d-none");
                mainBody.classList.remove("bg-light");
                
                gameContainer.classList.remove("d-none");
                gameContainer.classList.add("d-flex");
                gameIframe.src = `/play/${data.id}/pewpew.html`;
                
                // attach our secret interceptor once the iframe loads
                gameIframe.onload = function() {
                    const targetWindow = gameIframe.contentWindow;
                    const originalLog = targetWindow.console.log;
                    const treeContainer = document.getElementById("memoryTree");

                    // overwrite the sandbox's console to catch our specific string
                    targetWindow.console.log = function(...args) {
                        // join arguments into a single string to handle engine formatting
                        const logLine = args.join(" ");

                        if (logLine.includes("__MEM__")) {
                            try {
                                // 1. slice out everything before the JSON structure starts
                                const jsonStartIndex = logLine.indexOf("__MEM__") + 7;
                                let jsonStr = logLine.substring(jsonStartIndex);
                                
                                // 2. wipe out the 'fx' suffix from fixed-point numbers so it becomes valid JSON
                                // this turns 210.0fx into 210.0
                                jsonStr = jsonStr.replace(/(-?\d+(?:\.\d+)?)fx/g, "$1");
                                
                                // 3. parse the sanitized string
                                const memoryState = JSON.parse(jsonStr);
                                treeContainer.innerHTML = renderJsonTree(memoryState);
                            } catch (e) {
                                // if it still drops, print out the exact string that failed
                                originalLog.apply(targetWindow.console, ["Mangled JSON target:", logLine, e]);
                            }
                        } else {
                            // let standard game prints pass through to devtools normally
                            originalLog.apply(targetWindow.console, args);
                        }
                    };
                };
                
            } catch (error) {
                console.error("upload failed:", error);
                errorMessage.textContent = "upload failed! make sure your python script is running.";
                errorArea.classList.remove("d-none");
                uploadBtn.textContent = "Upload & Launch";
                uploadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
