<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder Uploader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <h4 class="card-title text-center mb-4">Upload a Folder</h4>
                
                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="folderInput" class="form-label text-muted">Select a folder from your computer</label>
                        <input class="form-control" type="file" id="folderInput" webkitdirectory directory multiple required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Upload to Server</button>
                </form>

                <div id="resultArea" class="mt-4 d-none">
                    <div class="alert alert-success text-center" role="alert">
                        Folder processed successfully! 🎉<br>
                        <strong>Your ID:</strong> <span id="folderIdDisplay" class="font-monospace"></span>
                    </div>
                </div>

                <div id="errorArea" class="mt-4 d-none">
                    <div class="alert alert-danger text-center" role="alert" id="errorMessage">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("uploadForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            const fileInput = document.getElementById("folderInput");
            const resultArea = document.getElementById("resultArea");
            const errorArea = document.getElementById("errorArea");
            const folderIdDisplay = document.getElementById("folderIdDisplay");
            const errorMessage = document.getElementById("errorMessage");

            // hide alerts on new submission
            resultArea.classList.add("d-none");
            errorArea.classList.add("d-none");

            // package up the files
            const formData = new FormData();
            for (let i = 0; i < fileInput.files.length; i++) {
                const file = fileInput.files[i];
                // the magic is here: webkitRelativePath forces the browser to send the folder structure
                formData.append("files", file, file.webkitRelativePath);
            }

            try {
                // send to our python backend
                const response = await fetch("http://127.0.0.1:8000/inject/", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("server responded with an error.");
                }

                const data = await response.json();
                
                // display the cute little id
                folderIdDisplay.textContent = data.id;
                resultArea.classList.remove("d-none");
                
            } catch (error) {
                console.error("upload failed:", error);
                errorMessage.textContent = "upload failed! make sure your python script is running and CORS is enabled.";
                errorArea.classList.remove("d-none");
            }
        });
    </script>
</body>
</html>
